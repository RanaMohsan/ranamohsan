<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Information</title><link rel="stylesheet" href="/css/app.css?v=final-fixes-20260715"></head><body><div class="shell"><div class="top"><div><h1>Company Information</h1><p class="muted">Printed on invoices, receipts and ledgers</p></div><div class="nav"><a href="/workspace.html">Workspace</a><a href="/reports.html">Reports</a></div></div><div class="split"><div class="panel"><label>Company Name</label><input id="companyName"><label>Address</label><textarea id="addressLine" rows="4"></textarea><div class="row"><div><label>Phone No.</label><input id="phoneNo"></div><div><label>Email</label><input id="email"></div></div><div class="row"><div><label>Website</label><input id="website"></div><div><label>Tax / NTN / VAT No.</label><input id="taxRegistrationNo"></div></div><label>Logo Path / File Name</label><input id="logoPath" readonly><input id="logoFile" type="file" accept="image/*"><div class="actions"><button onclick="saveCompany()">Save Company Information</button><button class="secondary" onclick="removeLogo()">Remove Logo</button><button class="secondary" onclick="loadCompany()">Reload</button></div><p id="status"></p></div><div class="panel"><h2>Logo Preview</h2><img id="logoPreview" style="max-width:100%;max-height:260px;display:none"><div id="noLogo" class="badge">No Logo Selected</div><p class="muted">Logo is saved in SQL as image data so reports keep working even if the original picture file is moved.</p></div></div></div><script src="/js/api.js"></script><script src="/js/company.js"></script><script src="/js/app-shell.js?v=final-fixes-20260715"></script></body></html>
