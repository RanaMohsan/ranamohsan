<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PayNex Cloud ERP</title>
  <link rel="stylesheet" href="/css/app.css?v=home-cal-compact-20260801">
</head>
<body class="fo-home-page">
  <main class="shell fo-home-shell">
    <section class="fo-workspace-title">
      <h1 id="homeCompanyName">PayNex Cloud ERP</h1>
      <p class="muted">Core SMB ERP actions: master data, invoices, payments and ledger entries.</p>
    </section>

    <section class="fo-dashboard-layout">
      <aside class="fo-home-left-card">
        <div class="fo-company-avatar-wrap">
          <div class="fo-company-avatar" id="homeCompanyAvatar" aria-hidden="true">
            <img id="homeCompanyLogo" alt="" hidden>
            <span id="homeCompanyInitials">PN</span>
          </div>
          <div class="fo-company-avatar-meta">
            <strong id="homeCompanyAvatarName">Company</strong>
          </div>
        </div>

        <div class="fo-calendar-card">
          <div class="fo-calendar-head">
            <button type="button" class="fo-calendar-nav" aria-label="Previous month">‹</button>
            <strong id="foCalendarMonth">August 2026</strong>
            <button type="button" class="fo-calendar-nav" aria-label="Next month">›</button>
          </div>
          <div class="fo-calendar-weekdays">
            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
          </div>
          <div class="fo-calendar-grid" id="foCalendarGrid"></div>
        </div>

        <div class="fo-workitems-card">
          <div class="fo-workitems-head">
            <h2>My work</h2>
          </div>
          <p>No items yet.</p>
        </div>
      </aside>

      <section class="fo-module-grid" id="tiles" aria-label="Core ERP actions"></section>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/workspace.js?v=home-cal-compact-20260801"></script>
  <script src="/js/app-shell.js?v=otp-nav-20260731"></script>
</body>
</html>
