<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vendor Ledger Entry</title>
  <link rel="stylesheet" href="/css/app.css?v=api-catalog-20260731">
</head>
<body>
  <main class="shell erp-list-page">
    <section class="top">
      <div><h1>Vendor Ledger Entry</h1><p id="who" class="muted">Read-only ledger entries. Entries are created only through purchase invoices, returns and vendor payments.</p></div>
      <div class="nav"><a href="/workspace.html">Workspace</a><a href="/vendors.html">Vendors</a><a href="/vendor-payment.html">Vendor Payment</a></div>
    </section>
    <section class="panel">
      <div class="row"><label>Vendor<select id="ledgerVendor" data-lookup-title="Vendor Lookup"></select></label><label>From<input id="ledgerFrom" type="date"></label><label>To<input id="ledgerTo" type="date"></label><button onclick="loadLedger()">Load Ledger</button><button class="secondary" onclick="printLedger()">Print</button></div>
      <table class="table striped-table ledger-entry-table">
        <thead><tr><th>Date</th><th>Vendor</th><th>Doc Type</th><th>Doc No</th><th>Debit (Payment)</th><th>Credit (Invoice)</th><th>Balance</th></tr></thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </section>
  </main>
  <script src="/js/api.js?v=final-fixes-20260715"></script>
  <script src="/js/vendor-ledger.js?v=final-fixes-20260715"></script>
  <script src="/js/app-shell.js?v=api-nav-20260731"></script>
</body>
</html>
