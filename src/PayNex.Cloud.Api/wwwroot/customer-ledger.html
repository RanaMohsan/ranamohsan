<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer Ledger Entry</title>
  <link rel="stylesheet" href="/css/app.css?v=avatar-fix-20260812d">
</head>
<body>
  <main class="shell erp-list-page">
    <section class="top">
      <div><h1>Customer Ledger Entry</h1><p id="who" class="muted">Read-only ledger entries. Entries are created only through sales invoices, returns and customer payments.</p></div>
      <div class="nav"><a href="/workspace.html">Workspace</a><a href="/customers.html">Customers</a><a href="/customer-payment.html">Customer Payment</a></div>
    </section>
    <section class="panel">
      <div class="row"><label>Customer<select id="ledgerCustomer" data-lookup-title="Customer Lookup"></select></label><label>From<input id="ledgerFrom" type="date"></label><label>To<input id="ledgerTo" type="date"></label><button onclick="loadLedger()">Load Ledger</button><button class="secondary" onclick="printLedger()">Print</button></div>
      <table class="table striped-table ledger-entry-table">
        <thead><tr><th>Date</th><th>Customer</th><th>Doc Type</th><th>Doc No</th><th>Debit (Invoice)</th><th>Credit (Payment)</th><th>Balance</th></tr></thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </section>
  </main>
  <script src="/js/api.js?v=avatar-fix-20260812d"></script>
  <script src="/js/customer-ledger.js?v=final-fixes-20260715"></script>
  <script src="/js/app-shell.js?v=avatar-fix-20260812d"></script>
</body>
</html>
