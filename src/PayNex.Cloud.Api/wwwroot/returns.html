<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer Returns</title>
  <link rel="stylesheet" href="/css/app.css?v=api-catalog-20260731">
</head>
<body>
  <div class="shell">
    <div class="top">
      <div>
        <h1>Customer Returns</h1>
        <p id="who" class="muted">Enter a POS invoice, select items, and post the return. Stock is restored automatically.</p>
      </div>
      <div class="nav">
        <a href="/workspace.html">Workspace</a>
        <a href="/pos.html">POS</a>
        <a href="/shift.html">Shift</a>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:minmax(280px,.9fr) minmax(0,1.4fr);gap:14px;align-items:start">
      <div class="panel">
        <h2>Find Invoice</h2>
        <label>Original Invoice No.
          <input id="invoiceNo" placeholder="Invoice number" onkeydown="if(event.key==='Enter')loadLines()">
        </label>
        <label>Reason
          <input id="returnReason" placeholder="Optional reason" value="Customer return">
        </label>
        <div class="actions">
          <button class="secondary" onclick="loadLines()">Load Items</button>
          <button class="danger" onclick="postReturn()">Post Return</button>
        </div>
        <p id="returnStatus"></p>
      </div>

      <div class="panel">
        <div class="setup-section-title">
          <h2>Returnable Items</h2>
          <span class="lookup-chip">Direct post</span>
        </div>
        <div class="branch-table-wrap">
          <table class="branch-table">
            <thead>
              <tr>
                <th style="width:42px"></th>
                <th>Item</th>
                <th>Sold</th>
                <th>Available</th>
                <th>Return Qty</th>
              </tr>
            </thead>
            <tbody id="returnLinesBody">
              <tr><td colspan="5" class="muted">Enter an invoice number and load items.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/returns.js?v=returns-20260728"></script>
  <script src="/js/app-shell.js?v=api-nav-20260731"></script>
</body>
</html>
