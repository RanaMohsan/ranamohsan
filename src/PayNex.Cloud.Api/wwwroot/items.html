<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css?v=final-fixes-20260715"><title>Items</title></head>
<body><main class="shell bc-list-page bc-master-list-page" data-page-role="item-list">
<section class="bc-page-heading"><div><div class="bc-breadcrumb">Inventory / Items</div><h1>Items</h1><p id="who" class="muted">Loading company and user...</p></div><span class="bc-page-badge">List</span></section>
<section class="bc-command-bar" aria-label="Item actions"><button id="newBtn" class="bc-command-primary" type="button"><span>＋</span> New</button><button id="openBtn" class="secondary" type="button"><span>↗</span> Open</button><button id="printBtn" class="secondary" type="button"><span>▣</span> Print</button><button id="refreshBtn" class="secondary" type="button"><span>↻</span> Refresh</button></section>
<section class="bc-filter-pane bc-master-filter"><div class="bc-filter-title">Filter</div><label>Search<input id="searchTerm" type="search" placeholder="Item no., description or barcode..."></label><label>Status<select id="statusFilter" data-no-lookup="1"><option value="">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select></label><label>Inventory<select id="stockFilter" data-no-lookup="1"><option value="">All inventory</option><option value="available">Available</option><option value="low">Low stock</option><option value="out">Out of stock</option></select></label><button id="applyFilterBtn" type="button">Apply</button><button id="clearFilterBtn" class="secondary" type="button">Clear</button></section>
<section class="bc-list-card"><div class="bc-list-caption"><div><strong>Item List</strong><span id="recordCount" class="muted">0 records</span></div><div id="selectedCaption" class="muted">No item selected</div></div><div class="bc-table-wrap"><table class="bc-data-table bc-item-data-table"><thead><tr><th class="bc-select-col"></th><th>Picture</th><th>No.</th><th>Description</th><th>Barcode</th><th>Base Unit</th><th class="number">Unit Cost</th><th class="number">Unit Price</th><th class="number">Inventory</th><th class="number">Reorder Point</th><th>Status</th></tr></thead><tbody id="recordBody"><tr><td colspan="11" class="bc-empty-row">Loading items...</td></tr></tbody></table></div><div class="bc-list-footer"><span id="footerSummary">Total inventory: 0</span><span>Click the item number/name, or double-click a row, to open its Item Card.</span></div></section><p id="status" class="bc-status-line" aria-live="polite"></p>
</main><script src="/js/api.js?v=bc-master-pages-20260710"></script><script src="/js/items.js?v=bc-master-pages-20260710"></script><script src="/js/app-shell.js?v=final-fixes-20260715"></script></body></html>
