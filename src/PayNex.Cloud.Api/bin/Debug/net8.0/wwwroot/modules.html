<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InterNex Cloud Modules</title><link rel="stylesheet" href="/css/app.css?v=avatar-fix-20260812d"></head><body><div class="shell"><div class="top"><div><h1>Cloud Modules</h1><p id="who" class="muted">Clean table views for company, shift, returns and reports.</p></div><div class="nav"><a href="/workspace.html">Workspace</a><a href="/company.html">Company Setup</a><a href="/reports.html">Print Reports</a></div></div><div class="grid"><div class="panel"><h2>Company Information</h2><input id="cname" placeholder="Company Name"><input id="caddr" placeholder="Address"><input id="cphone" placeholder="Phone"><input id="cemail" placeholder="Email"><input id="ctax" placeholder="Tax Registration No"><button onclick="saveCompany()">Save Company Info</button><p id="companyStatus"></p><table class="table striped-table"><tbody id="companyBody"></tbody></table></div><div class="panel"><h2>Shift</h2><input id="openingCash" type="number" placeholder="Opening Cash" value="0"><button onclick="openShift()">Open Shift</button><input id="closingCash" type="number" placeholder="Closing Cash" value="0"><button class="secondary" onclick="closeShift()">Close Shift</button><button class="secondary" onclick="currentShift()">Current Shift</button><p id="shiftStatus"></p><table class="table striped-table"><tbody id="shiftBody"></tbody></table></div></div><div class="grid"><div class="panel"><h2>Sales Return</h2><input id="invoiceNo" placeholder="Original Invoice No"><button onclick="loadReturnLines()">Load Returnable Lines</button><div class="invoice-lines-wrap"><table class="table striped-table"><thead><tr><th>Select</th><th>Product</th><th>Sold</th><th>Available</th><th>Return Qty</th></tr></thead><tbody id="returnLinesBody"></tbody></table></div><input id="returnReason" placeholder="Reason"><button onclick="postReturn()">Post Return</button><p id="returnStatus"></p></div><div class="panel"><h2>Reports</h2><div class="row"><button onclick="loadReport('/api/reports/trial-balance')">Trial Balance</button><button onclick="loadReport('/api/reports/stock-valuation')">Stock Valuation</button></div><div class="row"><button onclick="loadReport('/api/reports/tax')">Tax Report</button><button onclick="loadReport('/api/reports/daily-profit')">Daily Profit</button></div><div class="row"><button onclick="loadReport('/api/sales-invoices')">Sales Invoices</button><button onclick="loadReport('/api/purchase-invoices')">Purchase Invoices</button></div><div class="invoice-lines-wrap"><table class="table striped-table"><thead id="reportHead"></thead><tbody id="reportBody"></tbody></table></div></div></div></div><script src="/js/api.js?v=avatar-fix-20260812d"></script><script src="/js/modules.js"></script><script src="/js/app-shell.js?v=avatar-fix-20260812d"></script></body></html>
