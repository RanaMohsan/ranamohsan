<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Operations</title><link rel="stylesheet" href="/css/app.css?v=avatar-fix-20260812d"></head><body><div class="shell"><div class="top"><div><h1>Inventory Operations</h1><p id="who" class="muted">Stock transfer and adjustment</p></div><div class="nav"><a href="/workspace.html">Workspace</a><a href="/portal.html">Portal</a></div></div><div class="grid"><div class="panel"><h2>Stock Transfer</h2><label>From Store</label><select id="fromStore" onchange="loadStoreProducts()"></select><label>To Store</label><select id="toStore"></select><label>Product</label><select id="transferProduct"></select><label>Quantity</label><input id="transferQty" type="number"><button onclick="postTransfer()">Post Transfer</button><p id="transferStatus"></p></div><div class="panel"><h2>Stock Adjustment</h2><label>Store</label><select id="adjustStore" onchange="loadAdjustProducts()"></select><label>Product</label><select id="adjustProduct"></select><label>Counted Quantity</label><input id="countedQty" type="number"><label>Disposition</label><select id="disposition"><option>Available</option><option>Damaged</option><option>Expired</option><option>Lost</option><option>Adjustment</option></select><label>Reason</label><input id="adjustReason"><div class="row"><input id="batchNo" placeholder="Batch No"><input id="serialNo" placeholder="Serial No"><input id="expiryDate" type="date"></div><button onclick="postAdjustment()">Post Adjustment</button><p id="adjustStatus"></p></div></div><div class="panel"><h2>Store Products</h2><table class="table"><thead><tr><th>Product</th><th>Quantity</th><th>Cost</th></tr></thead><tbody id="stockBody"></tbody></table></div></div><script src="/js/api.js?v=avatar-fix-20260812d"></script><script src="/js/inventory.js"></script><script src="/js/app-shell.js?v=avatar-fix-20260812d"></script></body></html>
